<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รอประกาศผล - Waste Care World</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'], },
                    colors: { 
                        app: {
                            bg: '#F2F7F4',        
                            primary: '#5C8D67',   
                            secondary: '#A5C7A9', 
                            accent: '#F4B95F',    
                            dark: '#253E2B',      
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 50px -10px rgba(92, 141, 103, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #F2F7F4; 
            color: #253E2B; 
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }
        
        /* Floating Animation */
        .animate-float { animation: float 5s ease-in-out infinite; }
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-15px); } 
            100% { transform: translateY(0px); } 
        }

        /* Pulse glow animation for the badge */
        .animate-glow { animation: glow 2s infinite alternate; }
        @keyframes glow {
            0% { box-shadow: 0 0 0 0 rgba(244, 185, 95, 0.4); }
            100% { box-shadow: 0 0 0 15px rgba(244, 185, 95, 0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Decorative Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-app-secondary rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-72 h-72 bg-app-primary rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md bg-white rounded-[32px] p-8 sm:p-10 flex flex-col items-center text-center shadow-soft relative z-10 border border-white/50 backdrop-blur-sm mx-auto transform transition-all hover:scale-[1.01]">
        
        <!-- Icon Section -->
        <div class="relative w-32 h-32 mb-8 animate-float">
            <div class="absolute inset-0 bg-[#EAF4EC] rounded-full animate-ping opacity-30"></div>
            <div class="absolute inset-0 bg-[#E6F0E8] rounded-full flex items-center justify-center z-10 shadow-inner border-[4px] border-white">
                <i class="fa-solid fa-earth-asia text-6xl text-app-primary drop-shadow-md"></i>
            </div>
            <!-- Small leaf decorations -->
            <i class="fa-solid fa-leaf absolute -top-2 -right-2 text-app-secondary text-xl transform rotate-12"></i>
            <i class="fa-solid fa-star absolute bottom-2 -left-2 text-app-accent text-lg transform -rotate-12"></i>
        </div>

        <!-- Text Section -->
        <h1 class="text-2xl sm:text-3xl font-bold text-app-dark mb-3 tracking-tight leading-tight">
            ขอบคุณที่ร่วมสนุก<br>และรักษ์โลกไปด้วยกัน
        </h1>
        
        <p class="text-gray-500 text-sm sm:text-base font-medium mb-8 leading-relaxed px-2">
            กิจกรรม Waste Care World <br class="hidden sm:block">กำลังอยู่ระหว่างการตรวจสอบผลคะแนน<br>และการจัดอันดับของผู้ดูแลโลกทุกท่าน
        </p>

        <!-- Highlight Badge -->
        <div class="bg-app-accent text-white px-8 py-4 rounded-full font-bold text-lg shadow-md animate-glow w-full tracking-wide">
            <i class="fa-solid fa-bullhorn mr-2"></i> รอประกาศผล เร็วๆ นี้!
        </div>

        <!-- Footer Note -->
        <div class="mt-10 pt-6 border-t border-gray-100 w-full">
            <img src="https://cdn-icons-png.flaticon.com/512/2913/2913426.png" class="w-8 h-8 object-contain mx-auto mb-2 opacity-50 grayscale" alt="Logo">
            <p class="text-[10px] text-gray-400 font-medium tracking-wider uppercase">Waste Care World &copy; 2026</p>
        </div>
    </div>

</body>
</html>
