<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปิดปรับปรุงชั่วคราว</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans Thai',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:white;
    overflow:hidden;
}

.container{
    text-align:center;
    max-width:700px;
    padding:40px;
}

.logo{
    width:120px;
    height:120px;
    margin:0 auto 30px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:3rem;
    margin-bottom:15px;
    font-weight:700;
}

.subtitle{
    font-size:1.2rem;
    opacity:0.85;
    margin-bottom:30px;
}

.message{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
    backdrop-filter:blur(15px);
}

.message p{
    line-height:1.8;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:rgba(34,197,94,0.15);
    border:1px solid rgba(34,197,94,0.4);
    padding:12px 20px;
    border-radius:999px;
    font-size:0.95rem;
}

.dot{
    width:10px;
    height:10px;
    background:#22c55e;
    border-radius:50%;
    animation:pulse 1.5s infinite;
}

.footer{
    margin-top:30px;
    opacity:0.7;
    font-size:0.9rem;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

@keyframes pulse{
    0%{
        transform:scale(1);
        opacity:1;
    }
    100%{
        transform:scale(2);
        opacity:0;
    }
}

@media(max-width:768px){
    h1{
        font-size:2rem;
    }

    .subtitle{
        font-size:1rem;
    }

    .container{
        padding:25px;
    }
}
</style>

</head>

<body>

<div class="container">

```
<div class="logo">
    🚧
</div>

<h1>ปิดปรับปรุงชั่วคราว</h1>

<div class="subtitle">
    Temporary Maintenance
</div>

<div class="message">
    <p>
        ขณะนี้ระบบอยู่ระหว่างการปรับปรุงและพัฒนาเพื่อเพิ่มประสิทธิภาพการให้บริการ<br>
        ขออภัยในความไม่สะดวก และขอบคุณสำหรับความเข้าใจ
    </p>
</div>

<div class="status">
    <div class="dot"></div>
    ทีมงานกำลังดำเนินการปรับปรุงระบบ
</div>

<div class="footer">
    © 2026 Waste Care World<br>
    แล้วพบกันอีกครั้งเร็ว ๆ นี้
</div>
```

</div>

</body>
</html>
